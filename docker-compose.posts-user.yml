version: "3.8"

services:
  posts-db:
    image: postgres:15
    container_name: posts-db
    networks:
      - linkedin-network
    environment:
      POSTGRES_DB: postDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - posts-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres:15
    container_name: user-db
    networks:
      - linkedin-network
    environment:
      POSTGRES_DB: userDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - user-db-data:/var/lib/postgresql/data

  posts-service:
    image: vishalpatidar123/linkedin-app/posts-service:latest
    container_name: posts-service
    networks:
      - linkedin-network
    depends_on:
      - posts-db

  user-service:
    image: vishalpatidar123/linkedin-app/user-service:latest
    container_name: user-service
    networks:
      - linkedin-network
    depends_on:
      - user-db



# ===================== NETWORKS & VOLUMES =====================
networks:
  linkedin-network:

volumes:
  posts-db-data:
  user-db-data: